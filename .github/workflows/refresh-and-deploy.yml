name: Refresh events and deploy

on:
  schedule:
    - cron: "0 14 * * 4"   # Thursdays, 7 am Pacific (6 am in winter)
    - cron: "0 14 * * 6"   # Saturdays, same time
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]        # redeploy when you edit files by hand

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Rebuild events.json
        run: python scripts/refresh_events.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          SUGGESTIONS_CSV: ${{ vars.SUGGESTIONS_CSV }}
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A events.json specials.ics talks-concerts.json talks-concerts.ics data/geocache.json e/
          git diff --cached --quiet || git commit -m "Refresh events $(date -u +%F)"
          git push

  deploy:
    needs: refresh
    if: always() && needs.refresh.result != 'failure'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
